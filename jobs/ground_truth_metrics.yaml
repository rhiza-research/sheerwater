station_metrics:
  function: metric
  _all:
    start_time: "1998-01-01"
    end_time: "2024-12-31"
    forecast:
      - chirp_v3
      - chirps_v3
      - imerg_late
      - imerg_final
      - rain_over_africa
      - oya
      - tamsat
      - era5
    truth:
      - ghcn
      - ghcn_avg
      - tahmo
      - tahmo_avg
      - knust
      - knust_avg
      - stations
    spatial: false
    space_grouping: ['country', 'subregion']
    grid: ['global0_25', 'global1_5']
    variable: ['precip']
    time_grouping: ['None', 'month_of_year']
  combined_metrics:
    agg_days: [1, 5, 7, 10]
    metric_name: ['mae', 'rmse', 'bias', 'pearson', 'acc']
  wet_11_day:
    agg_days: [11]
    metric_name: ['pod-3.6', 'far-3.6', 'ets-3.6', 'csi-3.6', 'frequencybias-3.6']
  wet_5_day:
    agg_days: [5]
    metric_name: ['pod-7.6', 'far-7.6', 'ets-7.6', 'csi-7.6', 'frequencybias-7.6']
  wet_3_day:
    agg_days: [3]
    metric_name: ['pod-6.6', 'far-6.6', 'ets-6.6', 'csi-6.6', 'frequencybias-6.6']
  dry:
    agg_days: [7, 10]
    metric_name: ['pod-1.5', 'far-1.5', 'ets-1.5', 'csi-1.5', 'heidke-1.5-7.6']
