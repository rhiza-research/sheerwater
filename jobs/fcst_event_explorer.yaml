# early_season_accumulation uses has_seasonal_accumulation (needs ~120 days of
# forecast lead). Short-lead models (IFS-ER, GFS, Cumulus, …) only support the
# observed-event path (obs_filter=True, forecast_filter=False).

event_explorer_points:
  function: forecast_metric_points
  _all:
    start_time: "2016-01-01"
    end_time: "2024-12-31"
    variable: "precip"
    forecast:
      - cumulus_ai
    truth: "imerg_final"
    agg_days: 1
    lead_days:
      - 7
      - 14
      - 21
    time_grouping: None
    grid: "global1_5"
    region:
      - "western_africa"
      - "eastern_africa"
  two_way_events:
    metric_name:
      - "big_rain_days"
      - "in_season_dry_spell"
    metric_kwargs:
      - forecast_filter: false
        obs_filter: true
      - forecast_filter: true
        obs_filter: false
  early_season:
    metric_name:
      - "early_season_accumulation-30d"
    metric_kwargs:
      - forecast_filter: false
        obs_filter: true

