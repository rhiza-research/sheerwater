forecast_metrics:
  function: metric
  _all:
    start_time: "2016-01-01"
    end_time: "2024-12-31"
    forecast:
      - climatology_era5_1985_2015
      - climatology_imerg_1998_2016
      - ecmwf_ifs_er
      - ecmwf_ifs_er_debiased
      - ecmwf_aifs
      - ecmwf_ifs_ens
      - ecmwf_hres
      - salient
      - fuxi
      - gfs
      - gencast
      - graphcast
    truth:
      - era5
      - imerg_final
      - chirps_v3
    spatial: false
    space_grouping: ['country', 'subregion', 'rainfall_region', ['rainfall_region', 'country']]
    variable: ['precip']
    time_grouping: ['None', 'month_of_year', 'year']
    metric_name: ['mae', 'rmse', 'acc', 'bias']
    agg_days: [7]
  global1_5_metrics:
    grid: ['global1_5']
  global0_25_metrics:
    forecast:
      - salient
      - gfs
      - ecmwf_aifs
      - ecmwf_ifs_ens
      - ecmwf_hres
    grid: ['global0_25']
