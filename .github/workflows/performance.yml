name: Performance testing

# Expensive suite: run via workflow_dispatch on a non-main branch.
# Commits baseline timings onto that branch even on partial failure so progress
# from completed cases is not lost. Merge queue still runs correctness / default
# tests only.

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: github.ref_name != 'main'
    permissions:
      contents: write
      checks: write
      id-token: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Required for hatch-vcs
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Auth to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        token_format: 'access_token'
        workload_identity_provider: "projects/730596460290/locations/global/workloadIdentityPools/rhiza-github/providers/rhiza-github"
        service_account: "rhiza-github-action@rhiza-shared.iam.gserviceaccount.com"
        export_environment_variables: true

    - name: Setup gcloud
      uses: google-github-actions/setup-gcloud@v2

    - name: Cache nuthatch data
      uses: actions/cache@v4
      with:
        path: ~/.nuthatch/caches
        key: nuthatch-${{ runner.os }}
        restore-keys: |
          nuthatch-

    - name: Install uv
      uses: astral-sh/setup-uv@v7
    
    - name: Set up Python
      run: uv python install 3.12

    - name: Install dependencies
      run: uv sync --all-groups --all-extras

    - name: Coiled Login
      run: uv run coiled login --token ${{ secrets.COILED_API_TOKEN }}

    - name: Run tests
      id: pytest
      run: |
        mkdir -p coverage
        uv run pytest -m performance \
          -v -s \
          --junitxml=coverage/junit.xml \
          --cov-report=xml:coverage/coverage.xml \
          --cov-report=term

    # Completed cases write timings as they finish; commit even if the suite
    # fails or times out later so partial progress is retained on the branch.
    - name: Commit baseline to branch
      id: baseline
      if: always()
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git add sheerwater/tests/metrics_performance_baseline.json
        if git diff --staged --quiet; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "Baseline unchanged; nothing to commit."
          exit 0
        fi

        if [ "${{ steps.pytest.outcome }}" = "success" ]; then
          msg="Update metrics performance baseline"
        else
          msg="Update metrics performance baseline (partial run)"
        fi

        git commit -m "$msg"
        git pull --rebase origin "${{ github.ref_name }}"
        git push origin "HEAD:${{ github.ref_name }}"
        echo "changed=true" >> "$GITHUB_OUTPUT"

    - name: Upload test artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          coverage/junit.xml
          coverage/coverage.xml
          sheerwater/tests/metrics_performance_baseline.json
        retention-days: 30
        if-no-files-found: warn

  # Separate job so the third-party action doesn't have access to GCS credentials
  publish-results:
    runs-on: ubuntu-latest
    needs: test
    if: always() && needs.test.result != 'skipped'
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
    - name: Download test artifacts
      uses: actions/download-artifact@v4
      with:
        name: test-results

    - name: Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      with:
        files: junit.xml
